services:
  checkout-api:
    build: .
    environment:
      LAB_ALLOW_DEBUG_FAILURES: "true"
      OTEL_EXPORT_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./deploy/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:8889:8889"]
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["127.0.0.1:3200:3200"]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./deploy/loki/loki.yaml:/etc/loki/local-config.yaml:ro"]
    ports: ["127.0.0.1:3100:3100"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - "./deploy/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, tempo, loki]
